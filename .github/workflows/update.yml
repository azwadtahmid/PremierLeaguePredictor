# Runs the prediction pipeline every 3 hours and publishes the results.
#
# 1. Download the latest results and the fixture schedule.
# 2. Score locked predictions that have been played; lock new ones for
#    fixtures kicking off in the next 24 hours.
# 3. Re-simulate the season if a matchweek has finished.
# 4. Rebuild the website data (docs/data.json) and commit any changes, which
#    GitHub Pages then serves at https://azwadtahmid.github.io/PremierLeaguePredictor/
#
# A run where nothing changed makes no commit. Expect about one commit a day even
# without new results: the provisional predictions for later fixtures are refreshed
# as each day passes.

name: Update predictions

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (GitHub may start it a little late)
  workflow_dispatch:       # plus a "Run workflow" button in the Actions tab

permissions:
  contents: write          # allows the job to commit the updated results

concurrency:
  group: update-predictions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Download results and schedule
        run: python src/download.py

      - name: Build form features
        run: python src/features.py

      - name: Score and lock predictions
        run: python src/predict.py

      - name: Simulate the season
        run: python src/simulate.py

      - name: Build website data
        run: python src/site.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ docs/ models/goals_model.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update predictions $(date -u '+%Y-%m-%d %H:%M') UTC"
            # Someone may have pushed while this ran; put this commit on top.
            git pull --rebase origin main
            git push
          fi
